<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentia Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        #chat-window { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 1rem; margin-bottom: 1rem; }
        .message { margin-bottom: 0.5rem; }
        .user { color: blue; }
        .assistant { color: green; }
    </style>
</head>
<body>
    <h1>Agentia M1 Tracer Bullet</h1>
    <div id="chat-window"></div>
    <form id="chat-form">
        <input type="text" id="user-input" placeholder="輸入訊息..." style="width: 80%;">
        <button type="submit">發送</button>
    </form>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        
        let threadId = new URLSearchParams(window.location.search).get('thread_id') || '';
        let ws;

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<strong>${role === 'user' ? '你' : 'AI'}:</strong> <span class="content">${content}</span>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return div.querySelector('.content');
        }

        async function loadHistory() {
            if (!threadId) return;
            try {
                const response = await fetch(`/api/conversations/${threadId}`);
                const history = await response.json();
                history.forEach(msg => {
                    appendMessage(msg.role === 'user' ? 'user' : 'assistant', msg.content);
                });
            } catch (err) {
                console.error("Failed to load history:", err);
            }
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat${threadId ? '?thread_id=' + threadId : ''}`;
            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'session_init') {
                    threadId = data.thread_id;
                    const url = new URL(window.location);
                    url.searchParams.set('thread_id', threadId);
                    window.history.pushState({}, '', url);
                } else if (data.type === 'token') {
                    if (!window.currentResponseElem) {
                        window.currentResponseElem = appendMessage('assistant', '');
                    }
                    window.currentResponseElem.textContent += data.content;
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                } else if (data.type === 'turn_end') {
                    window.currentResponseElem = null;
                    userInput.disabled = false;
                }
            };

            ws.onclose = () => {
                console.log("WebSocket closed. Reconnecting in 2s...");
                setTimeout(connect, 2000);
            };
        }

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            appendMessage('user', text);
            ws.send(text);
            userInput.value = '';
            userInput.disabled = true;
        };

        async function init() {
            await loadHistory();
            connect();
        }

        init();
    </script>
</body>
</html>
